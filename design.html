<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño</title>

    <link rel="icon" href="assets/img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/styledesign.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="container nav-container">

        <div class="logo">
            <img src="assets/img/logo.png" alt="Logo">
        </div>

        <nav class="nav-menu">
            <a href="index.html#inicio">Inicio</a>
            <a href="index.html#projects">Proyectos</a>
            <a href="index.html#about">Sobre mí</a>
            <a href="index.html#services">Servicios</a>
            <a href="index.html#design">Diseño</a>
            <a href="index.html#contact">Contacto</a>
        </nav>

        <div class="nav-social">
            <a href="https://www.linkedin.com/in/carlos-duran-6600993ba/"><img src="assets/img/linkedin.png"></a>
            <a href="https://github.com/CarlosDF3?tab=overview&from=2026-04-01&to=2026-04-08"><img src="assets/img/github.png" class="github"></a>
        </div>

    </div>
</header>


<!-- DESIGN SECTION -->

<section id="design" class="section">
    <div class="container">

        <div class="section-head">
            <h2>Diseño</h2>
            <p>Trabajos de diseño gráfico aplicados a proyectos reales y clientes.</p>
        </div>

        <div class="design-grid">

            <div class="design-card" 
                 data-title="Identidad visual"
                 data-type="Marca"
                 data-client="Nanus Alicatados y Solados"
                 data-tools="Photoshop · Illustrator"
                 data-desc="Identidad de marca para empresa en el sector de alicatados y solados."
                 data-img="assets/img/nanus_logo.png">

                <img src="assets/img/nanus_logo.png" alt="Logo de Nanus">
                <div class="overlay">
                    <h3>Identidad visual</h3>
                    <p>Marca</p>
                </div>
            </div>

            <div class="design-card" 
                 data-title="Congreso Veterinario"
                 data-type="DL Flyer"
                 data-client="Grupo Emer"
                 data-tools="Photoshop · Indesign"
                 data-desc="Creación de flyer promocional para conferencia veterinaria en formato DL."
                 data-img="assets/img/emer_flyer.png">

                <img src="assets/img/emer_flyer.png" alt="dl flyer con diseño de congreso veterinario">
                <div class="overlay">
                    <h3>Congreso Veterinario</h3>
                    <p>DL Flyer</p>
                </div>
            </div>

            <div class="design-card" 
                 data-title="Identidad Visual"
                 data-type="Marca"
                 data-client="El arca de la sierra"
                 data-tools="Photoshop · Illustrator"
                 data-desc="Diseño de marca visual para tienda de mascotas, incluyendo logotipo y paleta de colores."
                 data-img="assets/img/arca_marca.png">

                <img src="assets/img/arca_marca.png" alt="logo arca">
                <div class="overlay">
                    <h3>Identidad Visual</h3>
                    <p>Marca</p>
                </div>
            </div>

        </div>
    </div>
</section>
    
</body>
<script src="script/script.js" defer></script>
</html>
